<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Robo Rumble — 2v2 Battle Simulator</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #030508;
      color: #eaf2ff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    #wrap {
      height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      grid-template-rows: 1fr;
    }

    #game {
      position: relative;
      min-width: 0;
      min-height: 0;
      height: 100%;
      background: #05070b;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #05070b;
    }

    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #topbar {
      position: absolute;
      left: 14px;
      right: 14px;
      top: 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .card {
      background: rgba(7, 12, 20, 0.84);
      border: 1px solid #26354a;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(5px);
    }

    #matchInfo {
      padding: 9px 12px;
      min-width: 205px;
    }

    #matchInfo.arcade {
      min-width: 230px;
    }

    #matchInfo .title {
      font-weight: 800;
      letter-spacing: 0.08em;
      font-size: 13px;
    }

    #phase {
      color: #91a6c4;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    #teamCards {
      display: flex;
      gap: 8px;
      max-width: 75%;
    }

    .teamcard {
      padding: 9px 11px;
      min-width: 190px;
    }

    .teamcard.teamA {
      border-color: #3b82ff;
    }

    .teamcard.teamB {
      border-color: #ef4444;
    }

    .teamcard .bar {
      height: 9px;
    }

    .teamcard .rname {
      font-size: 13px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
    }

    .teamcard .style {
      font-size: 10px;
      color: #93a7c3;
    }

    .bar {
      height: 5px;
      background: #172231;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 5px;
    }

    .bar > i {
      display: block;
      height: 100%;
      background: #65e38a;
      width: 100%;
      transition: width 0.1s;
    }

    #centerMsg {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
    }

    #centerMsg .box {
      padding: 18px 28px;
      min-width: 300px;
    }

    #centerMsg h1 {
      margin: 0 0 5px 0;
      font-size: 42px;
      letter-spacing: 0.14em;
      text-shadow: 0 0 24px rgba(255, 255, 255, 0.28);
    }

    #centerMsg .fightflash {
      font-size: 58px;
      font-weight: 1000;
      letter-spacing: 0.18em;
      color: #fff;
      text-shadow: 0 0 40px currentColor;
    }

    #centerMsg p {
      margin: 4px;
      color: #9eb1cc;
    }

    #controls {
      position: absolute;
      bottom: 14px;
      left: 14px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      pointer-events: auto;
    }

    button, select {
      font: inherit;
      color: #eaf2ff;
      background: #111b29;
      border: 1px solid #304258;
      border-radius: 7px;
      padding: 7px 10px;
      cursor: pointer;
    }

    button:hover, select:hover {
      background: #182536;
      border-color: #4b6481;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #replayControls {
      display: none;
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: auto;
      align-items: center;
      gap: 7px;
    }

    #scrub {
      width: min(430px, 38vw);
    }

    #legend {
      position: absolute;
      right: 14px;
      bottom: 14px;
      padding: 8px 10px;
      font-size: 10px;
      color: #9db0c9;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 4px;
    }

    #side {
      background: #0b111b;
      border-left: 1px solid #26354a;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #sideHead {
      padding: 12px;
      border-bottom: 1px solid #26354a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #sideHead strong {
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    #log {
      flex: 1;
      overflow: auto;
      padding: 9px;
      font: 10px / 1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #b9c8dc;
      white-space: pre-wrap;
    }

    .logline {
      padding: 3px 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.035);
    }

    .logline.hit {
      color: #f4c979;
    }

    .logline.ko {
      color: #ff7e7e;
      font-weight: 700;
    }

    .logline.ai {
      color: #9fd0ff;
    }

    .logline.turn {
      color: #b7efb7;
    }

    #summary {
      display: none;
      max-height: 42%;
      overflow: auto;
      border-top: 1px solid #26354a;
      padding: 10px;
      font-size: 11px;
    }

    #summary h3 {
      margin: 0 0 7px 0;
      font-size: 12px;
    }

    #summary table {
      width: 100%;
      border-collapse: collapse;
    }

    #summary td, #summary th {
      text-align: left;
      padding: 3px;
      border-bottom: 1px solid #1d2a3a;
    }

    #styleConfig {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      padding: 9px;
      border-bottom: 1px solid #26354a;
    }

    #styleConfig label {
      font-size: 10px;
      color: #8fa3bf;
    }

    @media (max-width: 900px) {
      #wrap {
        grid-template-columns: 1fr;
      }

      #side {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: min(330px, 82vw);
        transform: translateX(100%);
        transition: 0.2s;
        z-index: 4;
      }

      .side-open #side {
        transform: translateX(0);
      }

      #replayControls.show {
        display: flex;
      }
    }
  </style>
</head>

    /* ========================================

       ======================================== */

    const TAU = Math.PI * 2;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function angle(a, b) {
      return Math.atan2(b.y - a.y, b.x - a.x);
    }

    function normalizeAngle(a) {
      return Math.atan2(Math.sin(a), Math.cos(a));
    }

    function random(min, max) {
      return min + Math.random() * (max - min);
    }

    function randomPick(array) {
      return array[(Math.random() * array.length) | 0];
    }

    function cssEscape(str) {
      return String(str).replace(/[&<>"]/g, (m) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;"
      }[m]));
    }

    function lerpAngle(a, b, t) {
      return a + normalizeAngle(b - a) * t;
    }

    /**
     * Circle-to-rectangle collision push: separates a circle from a rectangle.
     * @param {Object} point - Circle center {x, y}
     * @param {number} radius - Circle radius
     * @param {Object} rect - Rectangle {x, y, w, h}
     * @returns {boolean} - Whether collision occurred
     */
    function circleRectPush(point, radius, rect) {
      const cx = clamp(point.x, rect.x, rect.x + rect.w);
      const cy = clamp(point.y, rect.y, rect.y + rect.h);
      let dx = point.x - cx;
      let dy = point.y - cy;
      const d = Math.hypot(dx, dy);

      if (d < radius) {
        if (d < 0.001) {
          // Ambiguous corner: push in direction of closest edge
          const left = Math.abs(point.x - rect.x);
          const right = Math.abs(point.x - (rect.x + rect.w));
          const top = Math.abs(point.y - rect.y);
          const bottom = Math.abs(point.y - (rect.y + rect.h));
          const m = Math.min(left, right, top, bottom);

          if (m === left) {
            point.x = rect.x - radius;
          } else if (m === right) {
            point.x = rect.x + rect.w + radius;
          } else if (m === top) {
            point.y = rect.y - radius;
          } else {
            point.y = rect.y + rect.h + radius;
          }
        } else {
          // Push away from closest point
          point.x = cx + (dx / d) * radius;
          point.y = cy + (dy / d) * radius;
        }
        return true;
      }
      return false;
    }

    /* ========================================

    const canvas = document.getElementById("c");

    let screenWidth = 0;
    let screenHeight = 0;
    let devicePixelRatio = 1;

    function handleCanvasResize() {
      devicePixelRatio = Math.min(2, window.devicePixelRatio || 1);
      screenWidth = canvas.clientWidth || window.innerWidth;
      screenHeight = canvas.clientHeight || window.innerHeight;
      canvas.width = Math.max(1, Math.floor(screenWidth * devicePixelRatio));
      canvas.height = Math.max(1, Math.floor(screenHeight * devicePixelRatio));
      ctx.scale(devicePixelRatio, devicePixelRatio);

    window.addEventListener("resize", handleCanvasResize);

    const STYLES = CONFIG.styles;

    // Game loop state

    // Match state

    /* ========================================
       ROBOT CLASS
       ======================================== */

    /**
     * Fighter robot in the arena.
     * 
     * States: IDLE → SEEK → (ATTACK | GRAPPLE | COUNTER | GUARD | EVADE)
     * 
     * @class Robot
     * @param {string} name - Fighter name
     * @param {number} team - Team index (0 or 1)
     * @param {string} style - Fighting style name
     * @param {number} spawnIndex - Spawn point index
     */
    class Robot {
      constructor(name, team, style, spawnIndex) {
        const styleStats = STYLES[style];
        const spawnPoint = spawn[spawnIndex];

        // Identity
        this.name = name;
        this.team = team;
        this.style = style;

        // Position and movement
        this.x = spawnPoint[0];
        this.y = spawnPoint[1];
        this.vx = 0;
        this.vy = 0;
        this.angle = team === 0 ? 0 : Math.PI;

        // Health
        this.hp = styleStats.hp * CONFIG.combat.hpMultiplier;
        this.maxHp = styleStats.hp * CONFIG.combat.hpMultiplier;
        this.radius = CONFIG.arena.fighterRadius;

        // Core state machine
        this.state = "IDLE";
        this.stateTime = 0;
        this.target = null;

        // Action timers and cooldowns
        this.cool = 0;           // Attack cooldown
        this.attack = 0;         // Current attack duration
        this.attackKind = "";    // Type of attack being performed
        this.special = 0;        // Special move cooldown
        this.guardTime = 0;      // Guard duration
        this.guard = 0;          // Guard active state (0 or 1)

        // Attack details
        this.attackTarget = null;
        this.attackDuration = 0;
        this.attackPhase = 0;
        this.attackContact = 0;
        this.attackBase = 0;
        this.attackReach = 0;
        this.attackSpecial = false;
        this.pendingHit = false;
        this.attackResolved = false;

        // Defense and reaction
        this.dodge = 0;          // Dodge duration
        this.dodgeDir = 0;       // Dodge direction (-1, 0, or 1)
        this.hitFlash = 0;       // Hit flash duration
        this.hitReact = 0;       // Hit reaction duration
        this.hitDir = 0;         // Direction of hit
        this.stagger = 0;        // Stagger duration
        this.recoil = 0;         // Recoil duration
        this.grapple = 0;        // Grapple state
        this.pinned = 0;         // Pinned duration

        // Knockdown and frozen states
        this.knockdown = 0;
        this.knockdownDir = 0;
        this.knockdownSpin = 0;
        this.frozen = 0;         // Frozen/ice effect duration
        this.invuln = 0;         // Invulnerability frames

        // Armor and special states
        this.headDetached = false;
        this.partialDecap = 0;
        this.disorient = 0;
        this.disorientJitter = 0;

        // Movement and animation
        this.walk = 0;
        this.stepPhase = 0;
        this.speedNow = 0;
        this.bodyLean = 0;

        // Combo system
        this.comboHits = 0;
        this.comboTimer = 0;
        this.comboChain = 0;
        this.feint = 0;          // Feint (fake attack) duration

        // Counter mechanics
        this.counterWindow = 0;
        this.counterFlash = 0;

        // Statistics
        this.damageDone = 0;
        this.damageTaken = 0;
        this.roundDamage = 0;
        this.attempts = 0;
        this.landed = 0;
        this.missed = 0;
        this.kos = 0;

        // State tracking for debugging
        this.states = {
          IDLE: 0,
          SEEK: 0,
          ATTACK: 0,
          EVADE: 0,
          RETREAT: 0,
          GRAPPLE: 0,
          COUNTER: 0
        };

        this.lastReason = "Booting tactical system";
        this.lastHit = -9;

        // Miscellaneous
        this.poseSeed = Math.random();
        this.specialType = "";
        this.airborne = 0;
      }

      /**
       * Check if this robot is alive.
       * @returns {boolean}
       */
      alive() {
        return this.hp > 0;
      }

      /**
       * Set current state with a reason for logging.
       * @param {string} newState - New state name
       * @param {string} reason - Reason for state change (for logging)
       */
      setState(newState, reason = "") {
        if (this.state !== newState) {
          this.state = newState;
          this.stateTime = 0;
          this.lastReason = reason;
          logAI(this);
        }
      }
    }
