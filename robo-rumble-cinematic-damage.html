<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Robo Rumble — 2v2 Battle Simulator</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#030508;color:#eaf2ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
#wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:1fr}
#game{position:relative;min-width:0;min-height:0;height:100%;background:#05070b}
canvas{display:block;width:100%;height:100%;background:#05070b}
#hud{position:absolute;inset:0;pointer-events:none}
#topbar{position:absolute;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card{background:rgba(7,12,20,.84);border:1px solid #26354a;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.28);backdrop-filter:blur(5px)}
#matchInfo{padding:9px 12px;min-width:205px}#matchInfo.arcade{min-width:230px}
#matchInfo .title{font-weight:800;letter-spacing:.08em;font-size:13px}#roundClock{font-size:28px;font-weight:1000;letter-spacing:.08em;line-height:1;margin-top:5px;color:#eaf2ff;text-shadow:0 0 14px rgba(255,255,255,.18)}#roundClock.critical{color:#ffcf66;text-shadow:0 0 16px rgba(255,180,70,.55)}#roundClock.sudden{color:#ff657a;text-shadow:0 0 18px rgba(255,80,100,.7)}

#phase{color:#91a6c4;font-size:11px;text-transform:uppercase;letter-spacing:.12em}
#teamCards{display:flex;gap:8px;max-width:75%}
.teamcard{padding:9px 11px;min-width:190px}.teamcard.teamA{border-color:#3b82ff}.teamcard.teamB{border-color:#ef4444}.teamcard .bar{height:9px}.teamcard .rname{font-size:13px}
.teamcard .rname{font-weight:800;font-size:12px;display:flex;justify-content:space-between}
.teamcard .style{font-size:10px;color:#93a7c3}
.bar{height:5px;background:#172231;border-radius:99px;overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;background:#65e38a;width:100%;transition:width .1s}
#centerMsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
#centerMsg .box{padding:18px 28px;min-width:300px}
#centerMsg h1{margin:0 0 5px;font-size:42px;letter-spacing:.14em;text-shadow:0 0 24px rgba(255,255,255,.28)}#centerMsg .fightflash{font-size:58px;font-weight:1000;letter-spacing:.18em;color:#fff;text-shadow:0 0 12px #fff,0 0 35px #ff4f78;animation:fightFlash .7s ease-out}@keyframes fightFlash{0%{transform:scale(1.5);opacity:0}25%{opacity:1}100%{transform:scale(1);opacity:1}}
#centerMsg p{margin:4px;color:#9eb1cc}
#controls{position:absolute;bottom:14px;left:14px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto}
button,select{font:inherit;color:#eaf2ff;background:#111b29;border:1px solid #304258;border-radius:7px;padding:7px 10px;cursor:pointer}
button:hover,select:hover{background:#182536;border-color:#4b6481}
button:disabled{opacity:.45;cursor:not-allowed}
#replayControls{display:none;position:absolute;bottom:14px;left:50%;transform:translateX(-50%);pointer-events:auto;align-items:center;gap:7px}
#scrub{width:min(430px,38vw)}
#legend{position:absolute;right:14px;bottom:14px;padding:8px 10px;font-size:10px;color:#9db0c9}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
#side{background:#0b111b;border-left:1px solid #26354a;display:flex;flex-direction:column;min-width:0}
#sideHead{padding:12px;border-bottom:1px solid #26354a;display:flex;justify-content:space-between;align-items:center}
#sideHead strong{font-size:13px;letter-spacing:.08em}
#log{flex:1;overflow:auto;padding:9px;font:10px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#b9c8dc;white-space:pre-wrap}
.logline{padding:3px 4px;border-bottom:1px solid rgba(255,255,255,.035)}
.logline.hit{color:#f4c979}.logline.ko{color:#ff7e7e;font-weight:700}.logline.ai{color:#9fd0ff}.logline.turn{color:#b7efb7}
#summary{display:none;max-height:42%;overflow:auto;border-top:1px solid #26354a;padding:10px;font-size:11px}
#summary h3{margin:0 0 7px;font-size:12px}
#summary table{width:100%;border-collapse:collapse}
#summary td,#summary th{text-align:left;padding:3px;border-bottom:1px solid #1d2a3a}
#styleConfig{display:flex;gap:5px;flex-wrap:wrap;padding:9px;border-bottom:1px solid #26354a}
#styleConfig label{font-size:10px;color:#8fa3bf}
@media(max-width:900px){#wrap{grid-template-columns:1fr}#side{position:absolute;right:0;top:0;bottom:0;width:min(330px,82vw);transform:translateX(100%);transition:.2s;z-index:4}.side-open #side{transform:none}#teamCards{max-width:60%}.teamcard{min-width:120px}.teamcard:nth-child(n+3){display:none}}
</style>
</head>
<body>
<div id="wrap">
<section id="game">
<canvas id="c"></canvas>
<div id="hud">
  <div id="topbar">
    <div id="matchInfo" class="card"><div class="title">ROBO RUMBLE // 2v2</div><div id="phase">BOOT</div><div id="roundClock">01:00</div></div>
    <div id="teamCards"></div>
  </div>
  <div id="centerMsg"></div>
  <div id="controls">
    <button id="newBtn">NEW MATCH</button>
    <select id="preset"><option value="classic">Classic Styles</option><option value="random">Randomize Styles</option><option value="all">All Distinct</option></select>
    <button id="logBtn">LOG</button><button id="replayBtn" disabled>REPLAY</button>
  </div>
  <div id="replayControls">
    <button id="playBtn">PLAY</button><button id="restartReplay">RESTART</button>
    <input id="scrub" type="range" min="0" max="1" value="0" step="1"><span id="replayFrame">0/0</span>
  </div>
  <div id="legend" class="card"><span class="dot" style="background:#3b82ff"></span>TEAM BLUE&nbsp;&nbsp;<span class="dot" style="background:#ef4444"></span>TEAM RED</div>
</div>
</section>
<aside id="side">
  <div id="sideHead"><strong>DIAGNOSTIC CONSOLE</strong><button id="closeLog">×</button></div>
  <div id="styleConfig">
    <label>TEAM A <select id="a1"></select></label><label>TEAM B <select id="b1"></select></label>
  </div>
  <div id="log"></div>
  <div id="summary"></div>
</aside>
</div>
<script>
"use strict";

/* ----------------------------- Utilities ----------------------------- */
function roundRectPath(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
const TAU=Math.PI*2, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const ang=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
const normAng=a=>Math.atan2(Math.sin(a),Math.cos(a));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const cssEsc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function circleRectPush(p,r,rect){
  const cx=clamp(p.x,rect.x,rect.x+rect.w),cy=clamp(p.y,rect.y,rect.y+rect.h);
  let dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy);
  if(d<r){
    if(d<.001){ const left=Math.abs(p.x-rect.x),right=Math.abs(p.x-(rect.x+rect.w)),top=Math.abs(p.y-rect.y),bot=Math.abs(p.y-(rect.y+rect.h)); const m=Math.min(left,right,top,bot); if(m===left)p.x=rect.x-r; else if(m===right)p.x=rect.x+rect.w+r; else if(m===top)p.y=rect.y-r; else p.y=rect.y+rect.h+r; }
    else {p.x=cx+dx/d*r;p.y=cy+dy/d*r}
    return true;
  } return false;
}

/* ----------------------------- Canvas ----------------------------- */
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=canvas.clientWidth||window.innerWidth;H=canvas.clientHeight||window.innerHeight;canvas.width=Math.max(1,Math.floor(W*dpr));canvas.height=Math.max(1,Math.floor(H*dpr));ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",resize); resize();

/* ----------------------------- Arena ----------------------------- */
const arena={w:1800,h:1100};
const obstacles=[
 {x:760,y:150,w:280,h:55},{x:760,y:895,w:280,h:55},
 {x:260,y:430,w:80,h:240},{x:1460,y:430,w:80,h:240},
 {x:585,y:325,w:85,h:85},{x:1130,y:690,w:85,h:85},
 {x:860,y:500,w:80,h:100}
];
const spawn=[[330,300],[330,800],[1470,300],[1470,800]];

/* ----------------------------- Styles ----------------------------- */
const STYLES={
 "Kung Fu":{speed:190,range:70,damage:8,heavy:18,hp:100,attackRate:.32,color:"#35e67a"},
 "Wrestler":{speed:105,range:74,damage:12,heavy:30,hp:135,attackRate:.65,color:"#f0b52d"},
 "Boxer":{speed:145,range:125,damage:10,heavy:27,hp:110,attackRate:.52,color:"#3297ff"},
 "Brawler":{speed:125,range:82,damage:16,heavy:38,hp:118,attackRate:.75,color:"#ff3d3d"},
 "Martial Arts":{speed:155,range:100,damage:12,heavy:25,hp:108,attackRate:.48,color:"#b65cff"}
};
const styleNames=Object.keys(STYLES);

/* ----------------------------- Fighter sprites ----------------------------- */
// Clean, self-contained vector sprites: no external image files, so the game remains a single HTML file.
const SPRITE_META={
 "Kung Fu":{accent:"#35e67a",dark:"#123d2a",visor:"#b9ffd6",trim:"#72ffae"},
 "Boxer":{accent:"#3297ff",dark:"#102c4f",visor:"#bfe1ff",trim:"#66b5ff"},
 "Wrestler":{accent:"#f0b52d",dark:"#4a3510",visor:"#fff0a6",trim:"#ffd86a"},
 "Brawler":{accent:"#ff3d3d",dark:"#4d1114",visor:"#ffd0d0",trim:"#ff6868"},
 "Martial Arts":{accent:"#b65cff",dark:"#34124d",visor:"#efd4ff",trim:"#cf8cff"}
};
function spriteSvg(style,includeHead=true){
 const m=SPRITE_META[style];
 const plate = style==='Wrestler' ? 1.04 : style==='Brawler' ? 1.01 : 1;
 const collar = style==='Boxer' ? '#d9e6ef' : '#bfcbd5';
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 155">
 <defs>
  <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2f6f8"/><stop offset=".28" stop-color="#9eabb5"/><stop offset=".65" stop-color="#4b5965"/><stop offset="1" stop-color="#17222c"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="${m.trim}"/><stop offset="1" stop-color="${m.dark}"/></linearGradient>
  <linearGradient id="core" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#18242d"/><stop offset=".5" stop-color="#566875"/><stop offset="1" stop-color="#18242d"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="1.1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 </defs>
 <!-- compact neck and collar -->
 <g stroke="#26343f" stroke-width="2" stroke-linejoin="round">
   <path d="M42 48 L44 39 L56 39 L58 48 L54 54 L46 54Z" fill="${collar}"/>
   <path d="M39 49 Q50 43 61 49 L66 61 L58 68 L50 62 L42 68 L34 61Z" fill="url(#armor)"/>
   <!-- pectoral armor follows a human chest rather than a blocky torso -->
   <path d="M35 58 Q41 53 49 58 L48 73 Q41 77 34 70Z" fill="url(#armor)"/>
   <path d="M51 58 Q59 53 65 58 L66 70 Q59 77 52 73Z" fill="url(#armor)"/>
   <!-- exposed sternum/core channel -->
   <path d="M48.2 57 L51.8 57 L53 91 L50 98 L47 91Z" fill="url(#core)" stroke="${m.trim}"/>
   <path d="M49.2 61 L50.8 61 L51.3 88 L50 92 L48.7 88Z" fill="${m.accent}" opacity=".9" filter="url(#glow)"/>
   <!-- rib-like internal structure -->
   <path d="M39 73 Q44 78 47 78 M61 73 Q56 78 53 78 M38 81 Q43 85 47 85 M62 81 Q57 85 53 85" fill="none" stroke="#8c9aa5" stroke-width="1.4"/>
   <!-- tapered abdominal armor -->
   <path d="M37 72 Q50 78 63 72 L61 96 Q50 102 39 96Z" fill="url(#armor)"/>
   <path d="M39 79 Q50 84 61 79 M39.5 87 Q50 92 60.5 87" fill="none" stroke="#657580" stroke-width="1.5"/>
   <path d="M41 96 Q50 101 59 96 L57 105 Q50 109 43 105Z" fill="url(#edge)"/>
   <!-- clean shoulder caps with visible servo clearance -->
   <path d="M34 57 Q26 56 25 64 L31 70 L39 66Z" fill="url(#armor)" stroke="${m.trim}"/>
   <path d="M66 57 Q74 56 75 64 L69 70 L61 66Z" fill="url(#armor)" stroke="${m.trim}"/>
   <circle cx="31" cy="65" r="4.5" fill="#17222b" stroke="${m.trim}"/>
   <circle cx="69" cy="65" r="4.5" fill="#17222b" stroke="${m.trim}"/>
   <circle cx="31" cy="65" r="1.5" fill="${m.accent}"/>
   <circle cx="69" cy="65" r="1.5" fill="${m.accent}"/>
 </g>
 <!-- fine armor seams and fasteners -->
 <g fill="none" stroke="#d9e4eb" stroke-opacity=".34" stroke-width="1">
   <path d="M35 58 L39 65 M65 58 L61 65 M35 70 L39 73 M65 70 L61 73"/>
   <path d="M43 58 L43 72 M57 58 L57 72"/>
   <path d="M42 99 L42 105 M58 99 L58 105"/>
 </g>
 <g fill="${m.accent}"><circle cx="39" cy="76" r="1.3"/><circle cx="61" cy="76" r="1.3"/><circle cx="43" cy="96" r="1.2"/><circle cx="57" cy="96" r="1.2"/></g>
 <!-- proportionate helmet: narrow, human-like, fitted to the frame -->
 ${includeHead?`<g stroke="#26343f" stroke-width="2" stroke-linejoin="round">
   <path d="M37 40 Q37 20 50 15 Q63 20 63 40 L58 51 Q50 56 42 51Z" fill="url(#armor)"/>
   <path d="M39 32 Q50 27 61 32 L60 41 Q50 46 40 41Z" fill="#101a22" stroke="${m.trim}"/>
   <path d="M42 34 Q50 31 58 34 L57 38 Q50 41 43 38Z" fill="${m.visor}" opacity=".9" filter="url(#glow)"/>
   <path d="M42 21 Q50 16 58 21" fill="none" stroke="#eef4f7" stroke-opacity=".55"/>
   <circle cx="42" cy="36" r="1.7" fill="${m.accent}"/><circle cx="58" cy="36" r="1.7" fill="${m.accent}"/>
 </g>`:`<g fill="none" stroke="#8f9da7" stroke-width="1.5"><path d="M43 49 L40 55 M57 49 L60 55"/><path d="M46 50 L44 57 M54 50 L56 57"/></g>`}
 <!-- exposed actuator/cable hints entering the shoulder and hip armor -->
 <g fill="none" stroke-linecap="round">
   <path d="M27 68 Q22 75 29 82" stroke="#7c8b96" stroke-width="2"/><path d="M73 68 Q78 75 71 82" stroke="#7c8b96" stroke-width="2"/>
   <path d="M31 83 Q27 91 34 99" stroke="${m.accent}" stroke-width="1.5"/><path d="M69 83 Q73 91 66 99" stroke="${m.accent}" stroke-width="1.5"/>
 </g>
 </svg>`;
}
const SPRITES={},SPRITES_NOHEAD={};
for(const style of styleNames){const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(spriteSvg(style));SPRITES[style]=img;const bodyImg=new Image();bodyImg.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(spriteSvg(style,false));SPRITES_NOHEAD[style]=bodyImg;}
for(const id of ["a1","b1"])document.getElementById(id).innerHTML=styleNames.map(s=>`<option>${s}</option>`).join("");
document.getElementById("a1").value="Kung Fu"; document.getElementById("b1").value="Brawler";

/* ----------------------------- Game model ----------------------------- */
const TEAM_COLORS=["#3b82ff","#ef4444"];
let robots=[],particles=[],floats=[],rings=[],projectiles=[],detachedHeads=[],shake=0,cam={x:900,y:550,z:0.62,tx:900,ty:550,tz:.62};
let phase="INTRO",matchTime=0,matchOver=false,last=performance.now(),acc=0;
let roundNo=1,roundTime=0,roundWins=[0,0],roundOver=false,boutOver=false;
let hitStop=0,comboCount=0,comboTimer=0,comboTeam=-1,finisherText="",announcerTimer=0,cinematic=null,teamAssaultTriggered=false;
let victoryTeam=-1,victoryStart=0,victoryKind="ROUND";
let combatMode="DUEL",combatModeTime=0,combatModeDuration=5.5,combatModeLabel="DUEL PHASE",duelTechnique=0,brawlSurge=0;
let replayFrames=[],replayIndex=0,replaying=false,replayPlaying=false;
let logEntries=[],summaryData={},turningPoints=[];
let tick=0, frameRecordAcc=0;

class Robot{
 constructor(name,team,style,i){
  const s=STYLES[style],p=spawn[i];
  this.name=name;this.team=team;this.style=style;this.x=p[0];this.y=p[1];this.vx=0;this.vy=0;
   this.angle=team===0?0:Math.PI;this.hp=s.hp*1.35;this.maxHp=s.hp*1.35;this.radius=28;
  this.state="IDLE";this.stateTime=0;this.target=null;this.cool=0;this.attack=0;this.attackKind="";
  this.hitFlash=0;this.dodge=0;this.dodgeDir=0;this.guard=0;this.guardTime=0;this.grapple=0;this.pinned=0;this.combo=0;this.walk=0;this.hitReact=0;this.hitDir=0;this.stagger=0;this.recoil=0;this.attackPhase=0;this.attackDuration=.42;this.bodyLean=0;this.poseSeed=Math.random()*10;this.stepPhase=0;this.prevX=this.x;this.prevY=this.y;this.speedNow=0;
  this.damageDone=0;this.damageTaken=0;this.roundDamage=0;this.attempts=0;this.landed=0;this.missed=0;
  this.states={IDLE:0,SEEK:0,ATTACK:0,EVADE:0,RETREAT:0,GRAPPLE:0,COUNTER:0};
  this.lastReason="Booting tactical system";this.lastHit=-9;this.feint=0;this.comboChain=0;this.counterWindow=0;this.counterFlash=0;this.kos=0;this.special=0;this.frozen=0;this.invuln=0;this.comboHits=0;this.comboTimer=0;this.finisherReady=0;this.specialType="";this.airborne=0;this.partialDecap=0;this.disorient=0;this.headSwing=0;this.headDetach=0;this.headDetached=false;this.detachedHead=null;this.knockdown=0;this.knockdownDir=0;this.knockdownSpin=0;this.bodyTwist=0;this.structure={head:100,leftArm:100,rightArm:100,leftLeg:100,rightLeg:100,torso:100};this.detached={leftArm:false,rightArm:false,leftLeg:false,rightLeg:false,torso:false};this.detachedParts=[];this.inoperable=false;this._registeredKO=false;
 }
 alive(){return this.hp>0}
 setState(s,reason=""){if(this.state!==s){this.state=s;this.stateTime=0;this.lastReason=reason;logAI(this)}}
}

function makeMatch(){
 const a=document.getElementById("a1").value,b=document.getElementById("b1").value;
 let styles;
 if(document.getElementById("preset").value==="random")styles=[pick(styleNames),pick(styleNames),pick(styleNames),pick(styleNames)];
 else if(document.getElementById("preset").value==="all")styles=styleNames.slice(0,4);
 else styles=[a,"Martial Arts",b,"Boxer"];
 robots=[
  new Robot("K-9",0,styles[0],0),new Robot("SABLE",0,styles[1],1),
  new Robot("BRUISER",1,styles[2],2),new Robot("VOLT",1,styles[3],3)
 ];
 particles=[];floats=[];rings=[];projectiles=[];detachedHeads=[];shake=0;cam={x:900,y:550,z:.62,tx:900,ty:550,tz:.62};
 phase="INTRO";matchTime=0;roundTime=0;suddenDeath=false;roundNo=1;roundWins=[0,0];roundOver=false;boutOver=false;matchOver=false;tick=0;acc=0;replayFrames=[];replayIndex=0;replaying=false;replayPlaying=false;hitStop=0;comboCount=0;comboTimer=0;comboTeam=-1;finisherText="";announcerTimer=0;cinematic=null;victoryTeam=-1;victoryStart=0;victoryKind="ROUND";combatMode="DUEL";combatModeTime=0;combatModeDuration=5.5;combatModeLabel="DUEL PHASE";duelTechnique=0;brawlSurge=0;
 logEntries=[];summaryData={};turningPoints=[];
 renderLog();updateRoundClock();updateTeamCards();render();setCenter(`<div class="box card"><h1>ROBO RUMBLE</h1><p>2v2 tactical combat initializing…</p><p style="font-size:12px;color:#65d8ff">${styles[0]} + ${styles[1]} &nbsp; VS &nbsp; ${styles[2]} + ${styles[3]}</p></div>`);
 setTimeout(()=>{if(!matchOver){phase="FIGHT";roundTime=0;announcerTimer=.8;setCenter(`<div class="fightflash">ROUND 1<br><span style="font-size:20px">FIGHT!</span></div>`);log("MATCH","Arena sealed. ROUND 1 begins — fight until team KO.");setTimeout(()=>{if(!matchOver)setCenter("")},1100)}},1200);
 log("MATCH",`Pre-fight roster: ${robots.map(r=>r.name+" ["+r.style+"]").join(" / ")}`);
}

/* ----------------------------- Logging ----------------------------- */
function log(kind,msg,cls=""){
 const t=`[${matchTime.toFixed(1)}s T${tick.toString().padStart(5,"0")}] ${msg}`;
 logEntries.push({t,cls:cls||kind.toLowerCase()}); if(logEntries.length>5000)logEntries.shift(); renderLog();
}
function logAI(r){log("AI",`${r.name} (${r.style}) STATE=${r.state} POS=(${r.x.toFixed(0)},${r.y.toFixed(0)}) FACING=${r.angle.toFixed(2)} TARGET=${r.target?r.target.name:"-" } ACTION=${r.state} REASON="${r.lastReason}"`,"ai")}
function eventAction(r,target,action,result,damage,before,after,reason){
 log("HIT",`${r.name} (${r.style}) STATE=${r.state} POS=(${r.x.toFixed(0)},${r.y.toFixed(0)}) ORIENT=${r.angle.toFixed(2)} TARGET=${target?target.name:"-"} ACTION=${action} RESULT=${result} DMG=${damage} HP=${before.toFixed(0)}->${after.toFixed(0)} REASON="${reason}"`,"hit");
}
function renderLog(){
 const el=document.getElementById("log"); if(!el)return;
 const atBottom=el.scrollTop+el.clientHeight>=el.scrollHeight-30;
 el.innerHTML=logEntries.map(e=>`<div class="logline ${e.cls}">${cssEsc(e.t)}</div>`).join("");
 if(atBottom)el.scrollTop=el.scrollHeight;
}
function finalSummary(){
 const html=`<h3>MATCH SUMMARY</h3><table><tr><th>Robot</th><th>Dmg</th><th>Taken</th><th>A/L/M</th></tr>${

/* ----------------------------- AI ----------------------------- */
function enemies(r){return robots.filter(x=>x.team!==r.team&&x.alive())}
function allies(r){return robots.filter(x=>x.team===r.team&&x!==r&&x.alive())}
function nearest(r,list=enemies(r)){return list.sort((a,b)=>dist(r,a)-dist(r,b))[0]||null}
function lineClear(a,b){
 const steps=Math.ceil(dist(a,b)/18);
 for(let i=1;i<steps;i++){const t=i/steps,x=lerp(a.x,b.x,t),y=lerp(a.y,b.y,t);if(obstacles.some(o=>x>o.x&&x<o.x+o.w&&y>o.y&&y<o.y+o.h))return false}
 return true;
}
function enemyBehind(r,t){return Math.abs(normAng(ang(t,r)-t.angle))>2.15}
function chooseTarget(r){
 const es=enemies(r); if(!es.length)return null;
 const mates=allies(r);
 // The fight deliberately alternates between readable duels and sudden team brawls.
 // DUEL: discourage both teammates from dog-piling the same opponent.
 if(combatMode==="DUEL" && mates.length){
   const used=new Set(mates.map(m=>m.target?.alive()?m.target:null).filter(Boolean));
   const free=es.filter(e=>!used.has(e));
   if(free.length) return free.slice().sort((a,b)=>dist(r,a)-dist(r,b))[0];
 }
 // BRAWL: converge on a shared target when an ally has already committed.
 if(combatMode==="BRAWL" && mates.length){
   const committed=mates.map(m=>m.target).filter(t=>t&&t.alive());
   if(committed.length && Math.random()<.78){
     return committed.slice().sort((a,b)=>dist(r,a)-dist(r,b))[0];
   }
 }
 return es.slice().sort((a,b)=>{
   const score=x=>dist(r,x)-((x.maxHp-x.hp)*.45)-(allies(x).length===0?55:0)-(enemyBehind(r,x)?15:0);
   return score(a)-score(b);
 })[0];
}

function formatRoundClock(sec){
  const remain=Math.max(0,60-sec),m=Math.floor(remain/60),ss=Math.floor(remain%60);
  return String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");
}
let suddenDeath=false;
function updateRoundClock(){
  const el=document.getElementById("roundClock");if(!el)return;
  el.textContent=suddenDeath?"SUDDEN":formatRoundClock(roundTime);
  el.classList.toggle("critical",!suddenDeath&&roundTime>=45);
  el.classList.toggle("sudden",suddenDeath);
}
function teamInoperable(team){return robots.filter(r=>r.team===team).every(r=>r.inoperable||r.hp<=0);}
function checkRoundEnd(){
  if(roundOver||boutOver||matchOver||phase!=="FIGHT")return;
  if(teamInoperable(0)){endRound(1,"TEAM BLUE FULLY INOPERABLE");return;}
  if(teamInoperable(1)){endRound(0,"TEAM RED FULLY INOPERABLE");return;}
  if(!suddenDeath&&roundTime>=60){
    suddenDeath=true;
    for(const r of robots)if(!r.inoperable){r.cool=0;r.special=0;}
    setCenter('<div class="fightflash" style="font-size:27px;color:#ff657a">SUDDEN DEATH<br><span style="font-size:14px">SYSTEM DAMAGE ESCALATED</span></div>');
    log("MATCH","60-second round clock expired. No team wipe — SUDDEN DEATH activated; combat continues until one team is fully inoperable.");
    shake=Math.max(shake,14);hitStop=.12;
    setTimeout(()=>{if(!matchOver&&phase==="FIGHT")setCenter("")},900);
  }
}

function updateCombatMode(dt){
 if(phase!=="FIGHT"||matchOver||cinematic)return;
 combatModeTime+=dt;
 duelTechnique=Math.max(0,duelTechnique-dt);
 brawlSurge=Math.max(0,brawlSurge-dt);
 if(combatModeTime>=combatModeDuration){
   combatMode=combatMode==="DUEL"?"BRAWL":"DUEL";
   combatModeTime=0;
   combatModeDuration=combatMode==="BRAWL"?(4.2+Math.random()*2.2):(5.6+Math.random()*3.6);
   combatModeLabel=combatMode==="BRAWL"?"MELEE BRAWL":"DUEL PHASE";
   if(combatMode==="BRAWL") brawlSurge=1.5; else duelTechnique=1.4;
   setCenter(`<div class="fightflash" style="font-size:25px;letter-spacing:.12em;color:${combatMode==="BRAWL"?'#ffd166':'#9edcff'}">${combatModeLabel}</div>`);
   log("MATCH",`Combat rhythm shifted to ${combatModeLabel}: ${combatMode==="BRAWL"?"teammates collapse onto shared targets with coordinated burst attacks.":"fighters separate into technical one-on-one exchanges with counters and chained techniques."}`);
   if(combatMode==="BRAWL"){
     for(const team of [0,1]){const members=robots.filter(r=>r.team===team&&r.alive());if(members.length){const cx=members.reduce((a,r)=>a+r.x,0)/members.length,cy=members.reduce((a,r)=>a+r.y,0)/members.length;spawnRing(cx,cy,120,"combo");spawnImpact(cx,cy,true);}}
     shake=Math.max(shake,18);hitStop=.06;
   }
   setTimeout(()=>{if(!matchOver&&!cinematic&&phase==="FIGHT")setCenter("")},700);
 }
}
function updateAI(r,dt){

 }
 if(r.frozen>0){r.frozen=Math.max(0,r.frozen-dt);r.vx*=.82;r.vy*=.82;r.setState("RETREAT","Frozen in place; systems recovering.");return;}
 r.states[r.state]=(r.states[r.state]||0)+dt;r.stateTime+=dt;r.cool=Math.max(0,r.cool-dt);r.special=Math.max(0,r.special-dt);r.guardTime=Math.max(0,r.guardTime-dt);r.guard=r.guardTime>0?1:0;
 const refreshTarget=!r.target||!r.target.alive()||r.stateTime>1.15||(combatMode==="BRAWL"&&r.stateTime>.55)||(combatMode==="DUEL"&&r.stateTime>1.8);
 const t=refreshTarget?chooseTarget(r):r.target; r.target=t; if(!t)return;
 const d=dist(r,t),to=ang(r,t),hp=r.hp/r.maxHp,s=STYLES[r.style],incoming=t.attack>0;
 const disorientJitter=r.disorient>0?Math.sin(matchTime*18+r.poseSeed)*.34:0;
 if(r.disorient>0)r.angle=lerpAngle(r.angle,to+disorientJitter,Math.min(1,dt*5));
 if(r.style==="Kung Fu"){
  if(incoming&&d<150&&r.dodge<=0){r.dodge=.28;r.dodgeDir=Math.random()<.5?-1:1;r.setState("EVADE","Reading the strike and slipping off-line.");}
  else if(d>92)r.setState("SEEK","Fast footwork and changing entry angle.");else if(r.cool<=0)r.setState("ATTACK","Inside striking envelope; chained sequence ready.");else r.setState("SEEK","Circling for a blind-side entry.");
 } else if(r.style==="Wrestler"){
  if(d>90)r.setState("SEEK","Closing behind guard to establish clinch range.");else if(d<82&&r.cool<=0)r.setState("GRAPPLE","Control window available; seeking positional pin.");else if(incoming)r.setState("EVADE","Turning into the committed attack.");else r.setState("SEEK","Cutting off escape route.");
 } else if(r.style==="Boxer"){
  if(incoming&&d<175){ if(r.cool>0||Math.random()<.42){r.guardTime=.34;r.setState("GUARD","Tight shell absorbs the incoming strike while maintaining pressure.");}else r.setState("COUNTER","Opponent committed; waiting for recovery window."); }else if(d>142)r.setState("SEEK","Maintaining measured boxing range.");else if(r.cool<=0)r.setState("ATTACK","Range set; jab-cross or hook sequence.");else r.setState("SEEK","Short lateral footwork between exchanges.");
 } else if(r.style==="Brawler"){
  if(incoming&&d<125&&r.cool>0){r.guardTime=.28;r.setState("GUARD","Forearms up while driving forward through contact.");}
  else if(d>105)r.setState("SEEK","Driving forward to force contact.");else if(r.cool<=0)r.setState("ATTACK","Power window; accepting risk for impact.");else r.setState("SEEK","Maintaining pressure.");
 } else {
  if(incoming&&d<160){ if(Math.random()<.35){r.guardTime=.30;r.setState("GUARD","Compact guard protects the centerline before re-entry.");}else r.setState("COUNTER","Adaptive read exposes a counter lane."); }else if(d>125)r.setState("SEEK","Adaptive spacing based on reach.");else if(r.cool<=0)r.setState("ATTACK","Balanced timing and range acquired.");else r.setState("EVADE","Preserving initiative for a cleaner opening.");
 }
 // Technical duel behavior: brief feints and counter windows create readable setup/response exchanges.
 if(combatMode==="DUEL"&&d>105&&d<285&&r.attack<=0&&r.cool<=0&&t.attack<=0&&r.state==="SEEK"&&r.stateTime>.22&&Math.random()<.035){
   r.feint=.22;r.dodgeDir=Math.random()<.5?-1:1;r.setState("EVADE","Short feint to draw a reaction before re-entry.");
 }
 if(r.feint>0){r.feint=Math.max(0,r.feint-dt);r.dodge=r.feint; r.dodgeDir=r.dodgeDir||1;}
 moveAI(r,t,dt);
 // Deliberate attack commitment: fighters wait for a readable opening instead of machine-gunning attacks.
 // Arcade-fighter cadence: every engagement must produce decisive attempts rather than
 // endless harmless footwork. Specials are opportunistic; basic strikes are reliable.
 const baseAttackWindow={"Kung Fu":.16,"Boxer":.18,"Wrestler":.22,"Brawler":.24,"Martial Arts":.18}[r.style]||.2;
 const comboBoost=combatMode==="DUEL"&&r.comboHits>0?.62:1;
 const attackWindow=(combatMode==="BRAWL"?baseAttackWindow*.60:baseAttackWindow*1.18)*comboBoost;
 const duelCounterReady=combatMode==="DUEL"&&t.attack>0&&d<=230&&r.cool<=0;
 r.counterWindow=duelCounterReady?.34:Math.max(0,r.counterWindow-dt);
 const specialChance=combatMode==="BRAWL"?.64:(duelCounterReady?.58:(r.comboHits>0?.22:.26));
 const specialReady=r.special<=0&&d<=680&&(duelCounterReady||hp<.82||r.comboHits>=1||Math.random()<specialChance);
 const strikingRange=d<=s.range+62;
 const attackState=["ATTACK","GRAPPLE","COUNTER"].includes(r.state);

}
function moveAI(r,t,dt){
 const s=STYLES[r.style],d=dist(r,t),to=ang(r,t);
 // Physical recovery: stagger/recoil temporarily override steering.
 if(r.stagger>0){
   r.stagger=Math.max(0,r.stagger-dt);
   r.vx*=Math.pow(.035,dt); r.vy*=Math.pow(.035,dt);
   r.x+=r.vx*dt; r.y+=r.vy*dt;
   r.angle=lerpAngle(r.angle,r.hitDir,Math.min(1,dt*8));
   r.bodyLean=lerp(r.bodyLean,-.18,Math.min(1,dt*12));
   r.x=clamp(r.x,55,arena.w-55); r.y=clamp(r.y,55,arena.h-55);
   for(const o of obstacles)circleRectPush(r,r.radius,o);
   return;
 }
 let desired=to,speed=s.speed;
 // Fighting-line positioning: close on the opponent's horizontal combat lane instead of
 // walking directly through/over them on arbitrary diagonals. This keeps both fighters
 // upright, readable, and visually side-by-side during exchanges.
 if(r.state!=="RETREAT" && d<420){
   const combatY=lerp(r.y,t.y,clamp((d-55)/260,0,1));
   const gap=combatMode==="DUEL"?Math.max(92,Math.min(s.range*.86,142)):Math.max(62,Math.min(s.range*.68,104));
   const side=(r.team===0?-1:1);
   const flank=(combatMode==="BRAWL"&&allies(r).some(a=>a.target===t)) ? (r===allies(r)[0]?1:-1) : side;
   const desiredX=t.x+flank*gap;
   const dx=desiredX-r.x,dy=combatY-r.y;
   desired=Math.atan2(dy,dx);
   if(d<170) speed*=combatMode==="DUEL"?.68:.82;
 }
 if(r.state==="GUARD")desired=to;
 // No defensive disengagement: the arena is always an active engagement.
 if(d>150) speed*=1.18;
 if(r.style==="Kung Fu" && r.state!=="RETREAT")desired+=Math.sin(matchTime*2+r.x)*.32;
 if(r.style==="Boxer" && r.state==="EVADE")desired=to+(Math.PI/2)*(Math.random()<.5?-1:1);
 if(r.style==="Martial Arts" && r.state==="EVADE")desired=to+Math.PI*.65;
 if(r.style==="Wrestler" && r.state==="GRAPPLE")desired=to;
 if(r.state==="ATTACK"||r.state==="COUNTER"||r.state==="GRAPPLE")speed*=.48;
 if(r.state==="GUARD")speed*=.62;
 if(d<(s.range*.78)&&r.state==="SEEK"&&r.style!=="Wrestler")speed*=.35;
 if(r.dodge>0){r.dodge-=dt;desired=to+r.dodgeDir*Math.PI/2;speed*=1.65}
 const dx=Math.cos(desired)*speed,dy=Math.sin(desired)*speed;
 r.vx=lerp(r.vx,dx,Math.min(1,dt*7));r.vy=lerp(r.vy,dy,Math.min(1,dt*7));
 r.speedNow=Math.hypot(r.vx,r.vy);
 r.bodyLean=lerp(r.bodyLean,clamp(r.speedNow/Math.max(1,s.speed)*.14,0,.14),Math.min(1,dt*7));
 r.stepPhase+=r.speedNow*dt*.055;
 if(Math.hypot(r.vx,r.vy)>8){r.angle=lerpAngle(r.angle,Math.atan2(r.vy,r.vx),Math.min(1,dt*10));r.walk+=dt*speed*.05}
 else r.walk+=dt*1.5;
 r.x+=r.vx*dt;r.y+=r.vy*dt;
 r.x=clamp(r.x,55,arena.w-55);r.y=clamp(r.y,55,arena.h-55);
 for(const o of obstacles)circleRectPush(r,r.radius,o);
 // Physical separation applies to opponents as well as teammates.
 for(const q of robots)if(q!==r&&q.alive()){
   const d2=dist(r,q),min=r.radius+q.radius+7;
   if(d2<min&&d2>.01){
     const a=ang(q,r),push=(min-d2)*.52;
     r.x+=Math.cos(a)*push;r.y+=Math.sin(a)*push;
     if(q.team!==r.team){r.vx*=.82;r.vy*=.82;}
   }
 }
}
function lerpAngle(a,b,t){return a+normAng(b-a)*t}

const __resolveAttackOriginal=resolveAttack;

     // Cryogenic shatter: target freezes solid, then the chassis fractures into crystalline panels.
     ctx.strokeStyle='#bdf8ff';ctx.lineWidth=6;ctx.beginPath();ctx.arc(p.x,p.y-35,55+70*fs,0,TAU);ctx.stroke();
     for(let i=0;i<10;i++){const aa=i*TAU/10+.2;const r1=18,r2=45+120*fs;ctx.beginPath();ctx.moveTo(p.x+Math.cos(aa)*r1,p.y-35+Math.sin(aa)*r1);ctx.lineTo(p.x+Math.cos(aa)*r2,p.y-35+Math.sin(aa)*r2);ctx.stroke()}
     ctx.fillStyle='rgba(180,245,255,.25)';ctx.beginPath();ctx.arc(p.x,p.y-35,45+30*fs,0,TAU);ctx.fill();
   }
   if(k.fatalStage>=2){
     ctx.globalAlpha=.8;ctx.strokeStyle='#ffb347';ctx.lineWidth=3;
     for(let i=0;i<18;i++){const aa=i*TAU/18+performance.now()*.006,rr=35+Math.random()*135;ctx.beginPath();ctx.moveTo(p.x,p.y-35);ctx.lineTo(p.x+Math.cos(aa)*rr,p.y-35+Math.sin(aa)*rr);ctx.stroke()}
   }
 }
 ctx.shadowBlur=0;
 // cinematic letterbox
 ctx.globalAlpha=.92;ctx.fillStyle='#000';ctx.fillRect(0,0,W,Math.max(22,H*.075));ctx.fillRect(0,H-Math.max(22,H*.075),W,Math.max(22,H*.075));
 ctx.restore();
}
function render(){
 ctx.clearRect(0,0,W,H);drawArena();
 for(const r of robots)drawRobot(r);drawDetachedParts();drawFX();drawVictoryPresentation();drawCinematic();
 if(replaying)renderReplayOverlay();
 if(!replaying && comboCount>=2){const p=worldToScreen(900,125);ctx.save();ctx.textAlign="center";ctx.font="900 22px system-ui";ctx.fillStyle="#ffd166";ctx.shadowColor="#ffd166";ctx.shadowBlur=12;ctx.fillText(`${comboCount} HIT COMBO`,p.x,p.y);ctx.restore()}
 updateTeamCards();
}
function renderReplayOverlay(){ctx.fillStyle="rgba(10,15,25,.65)";ctx.fillRect(0,0,W,3)}
function updateTeamCards(){
 const el=document.getElementById("teamCards");
 el.innerHTML=robots.map(r=>`<div class="teamcard card ${r.team===0?"teamA":"teamB"}"><div class="rname"><span>${r.name}</span><span>${Math.ceil(r.hp)}</span></div><div class="style">${r.style} · ${r.state}</div><div class="bar"><i style="width:${100*r.hp/r.maxHp};background:${TEAM_COLORS[r.team]}"></i></div></div>`).join("");
 document.getElementById("phase").textContent=phase+` · ROUND ${roundNo} · SCORE ${roundWins[0]}-${roundWins[1]} · ${combatModeLabel}`;
}

/* ----------------------------- Replay ----------------------------- */
function captureFrame(){
 replayFrames.push({
  time:matchTime,cam:{x:cam.x,y:cam.y,z:cam.z},
  robots:robots.map(r=>({name:r.name,team:r.team,style:r.style,x:r.x,y:r.y,angle:r.angle,hp:r.hp,state:r.state,attack:r.attack,attackKind:r.attackKind,walk:r.walk,pinned:r.pinned})),
  fx:{particles:particles.slice(0,70).map(p=>({x:p.x,y:p.y,vx:p.vx,vy:p.vy,life:p.life,max:p.max,size:p.size,type:p.type})),
      rings:rings.map(x=>({...x})),floats:floats.map(x=>({...x}))}
 });
}
function enterReplay(){
 if(!replayFrames.length)return;
 replaying=true;replayPlaying=false;replayIndex=0;
 document.getElementById("replayControls").style.display="flex";document.getElementById("replayBtn").textContent="LIVE";
 document.getElementById("scrub").max=replayFrames.length-1;document.getElementById("scrub").value=0;
 document.getElementById("replayFrame").textContent=`0/${replayFrames.length-1}`;
 setCenter("");phase="REPLAY";applyReplay(0);
}
function applyReplay(i){
 const f=replayFrames[clamp(i,0,replayFrames.length-1)];if(!f)return;
 cam.x=f.cam.x;cam.y=f.cam.y;cam.z=f.cam.z;matchTime=f.time;
 f.robots.forEach((d,j)=>{const r=robots[j];Object.assign(r,d)});
 particles=f.fx.particles.map(p=>({...p}));rings=f.fx.rings.map(x=>({...x}));floats=f.fx.floats.map(x=>({...x}));
 document.getElementById("scrub").value=i;document.getElementById("replayFrame").textContent=`${i}/${replayFrames.length-1}`;
}
function updateReplay(dt){
 if(!replayPlaying)return;
 replayIndex+=Math.max(1,Math.floor(dt*60));
 if(replayIndex>=replayFrames.length-1){replayIndex=replayFrames.length-1;replayPlaying=false;document.getElementById("playBtn").textContent="PLAY"}
 applyReplay(replayIndex);
}

/* ----------------------------- Main loop ----------------------------- */
function step(dt){
 if(replaying){updateReplay(dt);return}
 if(phase==="FIGHT"&&!matchOver){
   if(cinematic){updateFX(dt);updateDetachedParts(dt);updateRoundClock();checkRoundEnd();updateCamera(dt);return}
   if(hitStop>0){updateFX(dt);return}
   matchTime+=dt;roundTime+=dt;tick++;
   updateCombatMode(dt);
   for(const r of robots)updateAI(r,dt);
   updateFX(dt);updateDetachedParts(dt);updateRoundClock();checkRoundEnd();updateCamera(dt);
   frameRecordAcc+=dt;
   if(frameRecordAcc>=1/20){frameRecordAcc=0;captureFrame()}
 }else {updateFX(dt);updateDetachedParts(dt);updateRoundClock();}
}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;step(dt);render();requestAnimationFrame(loop)}
function setCenter(html){document.getElementById("centerMsg").innerHTML=html}

/* ----------------------------- UI ----------------------------- */
document.getElementById("newBtn").onclick=()=>{makeMatch();render();};
document.getElementById("logBtn").onclick=()=>document.body.classList.toggle("side-open");
document.getElementById("closeLog").onclick=()=>document.body.classList.remove("side-open");
document.getElementById("replayBtn").onclick=()=>{if(replaying){replaying=false;phase=matchOver?"VICTORY":"FIGHT";document.getElementById("replayControls").style.display="none";document.getElementById("replayBtn").textContent="REPLAY";setCenter(matchOver?`<div class="box card"><h1>REPLAY COMPLETE</h1></div>`:"");}else enterReplay()};
document.getElementById("playBtn").onclick=()=>{replayPlaying=!replayPlaying;document.getElementById("playBtn").textContent=replayPlaying?"PAUSE":"PLAY"};
document.getElementById("restartReplay").onclick=()=>{replayPlaying=false;replayIndex=0;document.getElementById("playBtn").textContent="PLAY";applyReplay(0)};
document.getElementById("scrub").oninput=e=>{replayPlaying=false;document.getElementById("playBtn").textContent="PLAY";applyReplay(+e.target.value)};
document.getElementById("preset").onchange=()=>{};
document.addEventListener("keydown",e=>{if(e.key===" "&&replaying){e.preventDefault();document.getElementById("playBtn").click()}if(e.key==="r"&&!replaying&&matchOver)enterReplay()});
window.addEventListener("error",e=>{console.error(e.error||e.message);phase="ERROR";setCenter(`<div class="box card"><h1>RUNTIME ERROR</h1><p style="color:#ff7e7e">${cssEsc(e.message)}</p><p style="font-size:11px">Reload the page after saving the file.</p></div>`);});
window.addEventListener("unhandledrejection",e=>{console.error(e.reason);});

function startGame(){
  try{
    resize();
    makeMatch();
    render();
    last=performance.now();
    if(typeof requestAnimationFrame==="function") requestAnimationFrame(loop);
    else setInterval(()=>loop(performance.now()),16);
  }catch(err){
    console.error(err);
    phase="ERROR";
    setCenter(`<div class="box card"><h1>STARTUP ERROR</h1><p style="color:#ff7e7e">${cssEsc(err&&err.message||err)}</p><p style="font-size:11px">Reload the page after saving the file.</p></div>`);
  }
}
startGame();
</script>
</body>
</html>
