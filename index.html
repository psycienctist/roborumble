const ARTI={};
for(const k in ARTSRC){const im=new Image();im.onload=()=>{im.ok=1;if(typeof scr!=='undefined'&&scr=='garage'&&typeof garage=='function'){try{garage()}catch(e){}}};im.src=ARTSRC[k];ARTI[k]=im}
const SILC={};
function sil(k,col){const key=k+col;if(SILC[key])return SILC[key];const im=ARTI[k];if(!im||!im.ok)return null;const cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height;const x=cv.getContext('2d');x.drawImage(im,0,0);x.globalCompositeOperation='source-in';x.fillStyle=col;x.fillRect(0,0,cv.width,cv.height);SILC[key]=cv;return cv}

function hrand(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)}
function glow(c,x,y,r,col,a){c.save();c.globalCompositeOperation='lighter';c.globalAlpha=Math.max(0,Math.min(1,a));const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'#ffffff');g.addColorStop(.25,col);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();c.restore()}
function bolt(c,x1,y1,x2,y2,seed,col,wd){const n=7;c.save();c.globalCompositeOperation='lighter';c.strokeStyle=col;c.lineWidth=wd;c.shadowColor=col;c.shadowBlur=8;c.beginPath();c.moveTo(x1,y1);for(let i=1;i<n;i++){const f=i/n,j=(hrand(seed+i)-.5)*Math.hypot(x2-x1,y2-y1)*.35;c.lineTo(x1+(x2-x1)*f-(y2-y1)/Math.hypot(x2-x1,y2-y1||1)*j,y1+(y2-y1)*f+(x2-x1)/Math.hypot(x2-x1||1,y2-y1)*j)}c.lineTo(x2,y2);c.stroke();c.lineWidth=wd*.4;c.strokeStyle='#fff';c.stroke();c.restore()}
function flame(c,x,y,ang,len,col,t,seed){const fl=len*(.8+.35*hrand(Math.floor(t*30)+seed));c.save();c.translate(x,y);c.rotate(ang);c.globalCompositeOperation='lighter';const g=c.createLinearGradient(0,0,fl,0);g.addColorStop(0,'#ffffff');g.addColorStop(.25,col);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.beginPath();c.moveTo(0,-len*.22);c.quadraticCurveTo(fl*.5,-len*.18,fl,0);c.quadraticCurveTo(fl*.5,len*.18,0,len*.22);c.closePath();c.fill();c.restore()}

function fxDraw(c,A,f,P,t,o,at,hot){/* P(x,y) maps sprite fractions to local coords */
 const [x,y]=P(f.x,f.y),sl=(o.slot||0)*1.7,ty=f.t;

 else if(ty=='drip'){c.save();c.globalCompositeOperation='lighter';for(let i=0;i<7;i++){const ph=(t*1.3+i/7+f.x)%1,dx=-ph*f.r*1.2,dy=-f.r*.5*ph+ph*ph*f.r*1.6;c.globalAlpha=.85*(1-ph);c.fillStyle=f.c;c.beginPath();c.arc(x+dx,y+dy,2.6*(1-ph*.4),0,7);c.fill()}c.restore()}
 else if(ty=='mist'){c.save();for(let i=0;i<6;i++){const ph=(t*.7+i/6+f.x)%1;c.globalAlpha=.4*(1-ph);c.fillStyle=f.c;c.beginPath();c.arc(x+ph*f.r*.6+Math.sin(i*3+t)*3,y-ph*f.r*.9,2+ph*7,0,7);c.fill()}c.restore()}
 else if(ty=='smoke'){c.save();for(let i=0;i<5;i++){const ph=(t*.5+i/5+f.x)%1;c.globalAlpha=.28*(1-ph);c.fillStyle='#8b8698';c.beginPath();c.arc(x+Math.sin(i*2.1+t)*6-ph*8,y+ph*f.r,4+ph*10,0,7);c.fill()}c.restore()}
 else if(ty=='sparks'){c.save();c.globalCompositeOperation='lighter';const n=hot||o.mv?7:3;for(let i=0;i<n;i++){const ph=(t*2.6+i/n)%1,a=f.ang+(hrand(i+Math.floor(t*2.6))-.5)*1.4,r=ph*f.r;c.strokeStyle=i%2?'#fff3b0':'#ffb020';c.globalAlpha=1-ph;c.lineWidth=1.3;c.beginPath();c.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r);c.lineTo(x+Math.cos(a)*(r+6),y+Math.sin(a)*(r+6));c.stroke()}c.restore()}
 else if(ty=='orb'){c.save();c.globalCompositeOperation='lighter';for(let i=0;i<5;i++){const a=t*3.2+i*1.256,rr=f.r*(.7+.3*Math.sin(t*2+i));c.fillStyle=i%2?'#ff9a3c':'#c77dff';c.globalAlpha=.8;c.beginPath();c.arc(x+Math.cos(a)*rr,y+Math.sin(a)*rr*.6,2.4,0,7);c.fill()}c.restore();glow(c,x,y,f.r*(hot?1.6:1.1),f.c,.8)}
 else if(ty=='disk'){c.save();c.globalCompositeOperation='lighter';const g=c.createRadialGradient(x,y,0,x,y,f.r);g.addColorStop(0,'rgba(255,240,180,.9)');g.addColorStop(.5,f.c);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.globalAlpha=.55+.2*Math.sin(t*6+sl);c.beginPath();c.ellipse(x,y,f.r,f.r*.24,0,0,7);c.fill();c.restore()}
}

 x.translate(bx,by);x.rotate(ang);const sp=(t*(o.mv||o.atk>0?9:4))%1;for(let i=-1;i<12;i++){const u=(i+sp)/10*L;x.fillStyle='rgba(0,0,0,.34)';x.beginPath();x.moveTo(u,-L);x.lineTo(u+L*.05,-L);x.lineTo(u+L*.05-L*.25,L);x.lineTo(u-L*.25,L);x.closePath();x.fill();x.fillStyle='rgba(255,255,255,.22)';x.beginPath();x.moveTo(u+L*.05,-L);x.lineTo(u+L*.075,-L);x.lineTo(u+L*.075-L*.25,L);x.lineTo(u+L*.05-L*.25,L);x.fill()}x.restore();
 x.globalCompositeOperation='destination-in';x.drawImage(im,0,0);x.globalCompositeOperation='source-over';c.drawImage(cv,X0,Y0,Wd,H)}

function blit(c,k,im,X0,Y0,Wd,H,o,hf,t){c.drawImage(im,X0,Y0,Wd,H);
 const ov=(col,a)=>{const s=sil(k,col);if(s&&a>0){c.save();c.globalAlpha=a;c.drawImage(s,X0,Y0,Wd,H);c.restore()}};

let RW=null,QSHK=0,QSHT=0;const QVS=new WeakMap();let QFX=[];
const QIMG={};for(const k in QPARTS){const p=QPARTS[k];if(!p.src)continue;const im=new Image();im.onload=()=>{im.ok=1};im.src=p.src;QIMG[k]=im}
const QSIL={};
function qsil(k,col){const key=k+col;if(QSIL[key])return QSIL[key];const im=QIMG[k];if(!im||!im.ok)return null;const cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height;const x=cv.getContext('2d');x.drawImage(im,0,0);x.globalCompositeOperation='source-in';x.fillStyle=col;x.fillRect(0,0,cv.width,cv.height);QSIL[key]=cv;return cv}
function qpart(c,k,o,hf,t){const p=QPARTS[k],im=QIMG[k];c.drawImage(im,p.x,p.y,p.w,p.h);
 const ov=(col,a)=>{const s=qsil(k,col);if(s&&a>0){c.save();c.globalAlpha=a;c.drawImage(s,p.x,p.y,p.w,p.h);c.restore()}};
 if(o.dead)ov('#0b0d12',.55);else{if(o.fz>0)ov('#9fe8ff',.45);if(hf<.35)ov('#ff2a1a',.10+.08*Math.sin(t*10));if(o.fl>0)ov('#ffffff',Math.min(.75,o.fl*6))}}
const q01=v=>v<0?0:v>1?1:v,qsm=v=>{v=q01(v);return v*v*(3-2*v)},qeo=v=>{v=q01(v);return 1-(1-v)*(1-v)*(1-v)},qei=v=>{v=q01(v);return v*v*v},
 qlp=(a,b,f)=>a+(b-a)*f,qsg=(x,a,b)=>q01((x-a)/(b-a)),qbk=v=>{v=q01(v);const s=1.6;return 1+(s+1)*Math.pow(v-1,3)+s*Math.pow(v-1,2)},

function qShake(t){const dt=Math.min(.1,Math.max(0,t-QSHT));QSHT=t;QSHK=Math.max(0,QSHK-dt*2.6);return QSHK*QSHK*22}

 for(const e of QFX){const g=e.ty=='shock'||e.ty=='crack'||e.ty=='dust'||e.ty=='puddle';if(g!==(layer=='g'))continue;const p=q01((t-e.t0)/e.d),s=e.s||1;c.save();
